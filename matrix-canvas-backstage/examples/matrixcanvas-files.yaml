# Demo only: registering individual source files as Components, just to see
# how registering/updating works. Not how you'd model a real catalog (a
# Component should normally represent a deployable service/website/library,
# not a single file) — delete this once you're done exploring.

apiVersion: backstage.io/v1alpha1
